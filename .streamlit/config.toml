[global]
showWarningOnDirectExecution = true
dataFrameSerialization = "arrow"


[theme]
base = "dark"

# Colors
textColor = "#e2e8f0"
primaryColor = "#3d30b3e8"
backgroundColor = "#010815e9"
secondaryBackgroundColor = "#0f172b"

# Widgets
showWidgetBorder = true
borderColor = "#8ba5cbff"

# Dataframes
dataframeHeaderBackgroundColor = "#1d293d"

# Base text
#font = "sans serif"
font = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
baseFontWeight = 300
baseFontSize = 14